services:
  tradingagents:
    build: .
    environment: &tradingagents_environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_CN_API_KEY: ${DASHSCOPE_CN_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_CN_API_KEY: ${ZHIPU_CN_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_CN_API_KEY: ${MINIMAX_CN_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      OPENAI_API_VERSION: ${OPENAI_API_VERSION:-}
      SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_DEFAULT_MODEL: ${TYPESAFE_DEFAULT_MODEL:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      TRADINGAGENTS_LLM_PROVIDER: ${TRADINGAGENTS_LLM_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      TRADINGAGENTS_DEEP_THINK_LLM: ${TRADINGAGENTS_DEEP_THINK_LLM:-}
      TRADINGAGENTS_QUICK_THINK_LLM: ${TRADINGAGENTS_QUICK_THINK_LLM:-}
      TRADINGAGENTS_DEEP_THINK_PROVIDER: ${TRADINGAGENTS_DEEP_THINK_PROVIDER:-}
      TRADINGAGENTS_QUICK_THINK_PROVIDER: ${TRADINGAGENTS_QUICK_THINK_PROVIDER:-}
      TRADINGAGENTS_DEEP_THINK_BACKEND_URL: ${TRADINGAGENTS_DEEP_THINK_BACKEND_URL:-}
      TRADINGAGENTS_QUICK_THINK_BACKEND_URL: ${TRADINGAGENTS_QUICK_THINK_BACKEND_URL:-}
      TRADINGAGENTS_LLM_BACKEND_URL: ${TRADINGAGENTS_LLM_BACKEND_URL:-}
      TRADINGAGENTS_OUTPUT_LANGUAGE: ${TRADINGAGENTS_OUTPUT_LANGUAGE:-}
      TRADINGAGENTS_MAX_DEBATE_ROUNDS: ${TRADINGAGENTS_MAX_DEBATE_ROUNDS:-}
      TRADINGAGENTS_MAX_RISK_ROUNDS: ${TRADINGAGENTS_MAX_RISK_ROUNDS:-}
      TRADINGAGENTS_MAX_TOOL_ROUNDS: ${TRADINGAGENTS_MAX_TOOL_ROUNDS:-}
      TRADINGAGENTS_CHECKPOINT_ENABLED: ${TRADINGAGENTS_CHECKPOINT_ENABLED:-}
      TRADINGAGENTS_NO_UPDATE_CHECK: ${TRADINGAGENTS_NO_UPDATE_CHECK:-}
      TRADINGAGENTS_RESULTS_DIR: ${TRADINGAGENTS_RESULTS_DIR:-}
      TRADINGAGENTS_CACHE_DIR: ${TRADINGAGENTS_CACHE_DIR:-}
      TRADINGAGENTS_MEMORY_LOG_PATH: ${TRADINGAGENTS_MEMORY_LOG_PATH:-}
      TRADINGAGENTS_BENCHMARK_TICKER: ${TRADINGAGENTS_BENCHMARK_TICKER:-}
      TRADINGAGENTS_TEMPERATURE: ${TRADINGAGENTS_TEMPERATURE:-}
      TRADINGAGENTS_LLM_MAX_RETRIES: ${TRADINGAGENTS_LLM_MAX_RETRIES:-}
      TRADINGAGENTS_MAX_TOKENS: ${TRADINGAGENTS_MAX_TOKENS:-}
      TRADINGAGENTS_OPENAI_REASONING_EFFORT: ${TRADINGAGENTS_OPENAI_REASONING_EFFORT:-}
      TRADINGAGENTS_GOOGLE_THINKING_LEVEL: ${TRADINGAGENTS_GOOGLE_THINKING_LEVEL:-}
      TRADINGAGENTS_ANTHROPIC_EFFORT: ${TRADINGAGENTS_ANTHROPIC_EFFORT:-}
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    environment:
      <<: *tradingagents_environment
      TRADINGAGENTS_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
